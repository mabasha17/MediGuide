<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contact | Medicine Recommendation System</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet"
    />
  </head>
  <body>
    <div class="container my-5">
      <h2 class="mb-4 text-primary">Contact Us</h2>
      <p>
        If you have questions, feedback, or need support, please reach out using
        the form below. We value your input and strive to respond promptly.
      </p>
      <form>
        <div class="mb-3">
          <label for="name" class="form-label">Name</label>
          <input
            type="text"
            class="form-control"
            id="name"
            placeholder="Your Name"
            required
          />
        </div>
        <div class="mb-3">
          <label for="email" class="form-label">Email address</label>
          <input
            type="email"
            class="form-control"
            id="email"
            placeholder="name@example.com"
            required
          />
        </div>
        <div class="mb-3">
          <label for="message" class="form-label">Message</label>
          <textarea
            class="form-control"
            id="message"
            rows="4"
            placeholder="Type your message here..."
            required
          ></textarea>
        </div>
        <button type="submit" class="btn btn-primary">Send Message</button>
      </form>
      <div class="mt-4">
        <p class="mb-0">
          For urgent inquiries, please email:
          <a href="mailto:mediguide@gmail.com">mediguide@gmail.com</a>
        </p>
      </div>
    </div>
    <footer class="footer mt-5 bg-primary text-white text-center py-3">
      &copy; {{ 2024 }} Medicine Recommendation System
    </footer>
  </body>
</html>
